# хвилини ("minutes") with two changes: the network always pays, the eyes check the way
#
# Based on the SDK sample minutes.yaml. A mixed income profile. Keeps the
# thread, holds four Tkachs, grows to 24 lit needles and checks contacts
# every 80 ticks.
# Changes against the sample (05-nakaz.md, section 3):
# - the dawn rule stands above ordinary growth, otherwise the free Tkach is
#   taken by the growth rule and never reaches the ring;
# - after tick 600 the swarm is not left empty: with energy above 150 the
#   nakaz orders a Tkach again while there are fewer than two units;
# - no feeding: a fed needle holds its Tkach for the rest of the match, and
#   the bot plays without feeding too (nofeed:1200 in bot/README.md).
# The nakaz runs the slot only when the bot is silent or has crashed.
nakaz: 1
name: "хвилини"
rules:
  - do: hold_net
  - when:
      all:
        - "my_drones < 4"
        - "tick < 600"
    do: { build_drone: { cls: tkach, upto: 4 } }
  - when: dawn
    do: { extend_to: { target: ring } }
  - when:
      all:
        - "my_drones < 2"
        - "my_energy > 150"
    do: { build_drone: { cls: tkach, upto: 2 } }
  - when:
      all:
        - "contract_open(any)"
        - "tick > 600"
    do: { take_contract: { prefer: nearest } }
  - when: "my_relays_online < 24"
    do: { extend_to: { target: nearest_cluster } }
  - when: "every 80"
    do: { scan_at: { target: densest_contacts, every: 80 } }
    priority: drop-on-budget
